[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qos-anomaly"
version = "1.0.0"
description = "Phát hiện bất thường QoS từ log HTTP bằng Isolation Forest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<2.8",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "streamlit>=1.59",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
